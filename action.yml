name: "Shorless PQC & CycloneDX 1.6 CBOM Scanner"
author: "Shorless Security"
description: "Audit Post-Quantique (6 Langages, 5 IaC, SCA Dépendances, Certificats X.509, TLS Live), Export SARIF, Auto-PR SaaS & CBOM CycloneDX 1.6."
branding:
  icon: "shield"
  color: "green"

inputs:
  target-dir:
    description: "Chemin du répertoire projet à analyser"
    required: false
    default: "."
  output-cbom:
    description: "Chemin du fichier CBOM CycloneDX 1.6 généré (--cbom)"
    required: false
    default: "cbom.json"
  output-sarif:
    description: "Chemin du rapport OASIS SARIF 2.1.0 généré pour GitHub Code Scanning (--sarif)"
    required: false
    default: ""
  report-html:
    description: "Chemin du rapport d'audit exécutif HTML/PDF généré (--report-html)"
    required: false
    default: "pqc-report.html"
  check-tls:
    description: "URL ou domaine:port à inspecter en direct (--check-tls)"
    required: false
    default: ""
  auto-fix:
    description: "Applique automatiquement les correctifs PQC sur le code, le SCA et les fichiers IaC (--fix)"
    required: false
    default: "false"
  dry-run:
    description: "Simule les corrections --fix sans modifier les fichiers (--dry-run)"
    required: false
    default: "false"
  api-key:
    description: "Clé d'API Shorless SaaS (--api-key) pour activer la télémétrie et l'ouverture automatique de Pull Requests"
    required: false
    default: ""
  project:
    description: "Nom du projet ou dépôt Git pour segmenter la télémétrie dans le Dashboard SaaS (--project)"
    required: false
    default: ""
  webhook-url:
    description: "URL de Webhook Slack / Microsoft Teams / Discord pour recevoir une alerte de score PQC (--webhook-url)"
    required: false
    default: ""
  auto-pr:
    description: "Crée une branche Git et ouvre automatiquement une Pull Request avec les correctifs (--auto-pr)"
    required: false
    default: "false"
  pr-base:
    description: "Branche cible pour la Pull Request automatique (--pr-base)"
    required: false
    default: "main"
  verbose:
    description: "Affiche le détail des fichiers analysés, leur type détecté et la probabilité d'exposition cryptographique (--verbose)"
    required: false
    default: "false"
  fail-on-critical:
    description: "Bloque le pipeline CI/CD (exit code 1) si au moins un risque CRITIQUE est détecté (--ci)"
    required: false
    default: "true"
  upload-artifact:
    description: "Téléverse automatiquement le CBOM JSON, le SARIF et le rapport HTML en artefacts GitHub Actions"
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install Shorless PQC Scanner
      shell: bash
      run: |
        python -m pip install --upgrade pip
        if [ -f "${{ github.action_path }}/pyproject.toml" ]; then
          python -m pip install "${{ github.action_path }}"
        else
          python -m pip install --upgrade shorless
        fi

    - name: Run Shorless PQC, SCA & CBOM Audit
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        INPUT_TARGET: ${{ inputs.target-dir }}
        INPUT_CBOM: ${{ inputs.output-cbom }}
        INPUT_SARIF: ${{ inputs.output-sarif }}
        INPUT_HTML: ${{ inputs.report-html }}
        INPUT_TLS: ${{ inputs.check-tls }}
        INPUT_FIX: ${{ inputs.auto-fix }}
        INPUT_DRY: ${{ inputs.dry-run }}
        INPUT_API_KEY: ${{ inputs.api-key }}
        INPUT_PROJECT: ${{ inputs.project }}
        INPUT_WEBHOOK: ${{ inputs.webhook-url }}
        INPUT_AUTO_PR: ${{ inputs.auto-pr }}
        INPUT_PR_BASE: ${{ inputs.pr-base }}
        INPUT_VERBOSE: ${{ inputs.verbose }}
        INPUT_CI: ${{ inputs.fail-on-critical }}
      run: |
        ARGS=("$INPUT_TARGET" "--cbom" "$INPUT_CBOM")

        if [ -n "$INPUT_SARIF" ]; then
          ARGS+=("--sarif" "$INPUT_SARIF")
        fi
        if [ -n "$INPUT_HTML" ]; then
          ARGS+=("--report-html" "$INPUT_HTML")
        fi
        if [ -n "$INPUT_TLS" ]; then
          ARGS+=("--check-tls" "$INPUT_TLS")
        fi
        if [ "$INPUT_FIX" = "true" ]; then
          ARGS+=("--fix")
        fi
        if [ "$INPUT_DRY" = "true" ]; then
          ARGS+=("--dry-run")
        fi
        if [ -n "$INPUT_API_KEY" ]; then
          ARGS+=("--api-key" "$INPUT_API_KEY")
        fi
        if [ -n "$INPUT_PROJECT" ]; then
          ARGS+=("--project" "$INPUT_PROJECT")
        fi
        if [ -n "$INPUT_WEBHOOK" ]; then
          ARGS+=("--webhook-url" "$INPUT_WEBHOOK")
        fi
        if [ "$INPUT_AUTO_PR" = "true" ]; then
          ARGS+=("--auto-pr" "--pr-base" "$INPUT_PR_BASE")
        fi
        if [ "$INPUT_VERBOSE" = "true" ]; then
          ARGS+=("--verbose")
        fi
        if [ "$INPUT_CI" = "true" ]; then
          ARGS+=("--ci")
        fi

        shorless "${ARGS[@]}"

    - name: Upload CycloneDX 1.6 CBOM, SARIF & Executive HTML Report
      if: always() && inputs.upload-artifact == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: cyclonedx-cbom-report
        path: |
          ${{ inputs.output-cbom }}
          ${{ inputs.output-sarif }}
          ${{ inputs.report-html }}
        if-no-files-found: ignore
