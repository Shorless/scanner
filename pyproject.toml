[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "shorless"
version = "0.8.7"
description = "Scanner DevSecOps Post-Quantique (PQC) & Générateur CBOM CycloneDX 1.6"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
authors = [
    { name = "Shorless Security", email = "contact@shorless.io" }
]
keywords = ["pqc", "post-quantum", "cbom", "cyclonedx", "devsecops", "cryptography", "ml-kem"]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0"
]

[project.urls]
Homepage = "https://shorless.io"
Documentation = "https://shorless.io/scanner-documentation.html"
Repository = "https://github.com/Shorless/scanner"

[project.scripts]
shorless = "shorless_scanner:app"

[tool.setuptools]
py-modules = ["shorless_scanner"]
